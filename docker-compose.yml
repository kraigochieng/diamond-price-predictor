services:
    # The MLflow UI service
    ml-ui:
        image: kraigochieng/diamond-price-predictor-ml
        build: ./ml
        ports:
            # Use the variable from the .env file
            - "${MLFLOW_PORT:-5000}:5000"
        volumes:
            - ./ml/mlruns:/app/mlruns
        env_file:
            - .env
        restart: unless-stopped

    # The FastAPI server
    server-api:
        image: kraigochieng/diamond-price-predictor-server
        build: ./server
        ports:
            # Use the variable from the .env file
            - "${SERVER_PORT:-8000}:8000"
        volumes:
            - ./ml/mlruns:/app/mlruns
        depends_on:
            - ml-ui
        env_file:
            - .env
        restart: unless-stopped
